<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Typing Speed Test</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Sora:wght@100..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <header class="container pt-4  pb-3 ">
    <nav class="d-flex justify-content-between">
      <!-- logo -->
      <img src="assets/images/logo-large.svg" class="d-none d-lg-block" alt="">
      <img src="assets/images/logo-small.svg" class="d-lg-none" alt="">
      <!-- personal best -->
      <div class="">
        <img src="assets/images/icon-personal-best.svg" class="d-inline-block " alt="">
        <span class="d-none d-lg-inline ">Personal best: </span>
        <span class="d-lg-none ">Best: </span>
        <span id="PB" class="text-light fw-semibold ">WPM</span>
      </div>
    </nav>
    <!-- options -->
    <div id="options"
      class="mt-5 d-flex flex-column flex-lg-row  justify-content-between align-items-center border-bottom border-2">
      <!-- details -->
      <div class="d-flex text-center mb-3  justify-content-center justify-content-lg-start  w100">
        <div class="d-flex flex-column align-items-lg-center flex-xl-row flex-grow-1 border-end  border-2 me-3">
          <p class="me-lg-3 ">WPM: </p>
          <span class="fw-bold fs-5 me-lg-3  WPM text-light ">0</span>
        </div>
        <div class="d-flex flex-column align-items-lg-center flex-xl-row flex-grow-1 border-end border-2 me-3">
          <p class="me-lg-3 ">Accuracy: </p>
          <span class="fw-bold fs-5 me-lg-3 Accuracy correct">0</span>
        </div>
        <div class="d-flex flex-column align-items-lg-center flex-xl-row flex-grow-1 me-lg-3">
          <p class="me-lg-3">Time: </p>
          <span id="Time" class=" color-Yellow fw-bold fs-5 me-lg-4 ">60</span>
        </div>
      </div>
      <!-- options -->
      <div class="d-flex align-items-center mb-3  w100  gap-3">

        <!-- lg screen -->
        <!-- difficulty -->
        <div class="d-lg-flex  align-items-center border-end border-2 d-none ">
          <p class="me-2">Difficulty:</p>
          <button type="button" name="easy" id="easy" class="btn border text-light me-2 rounded-3">Easy</button>
          <button type="button" name="medium" id="medium" class="btn border text-light me-2 rounded-3">Medium</button>
          <button type="button" name="hard" id="hard" class="btn border text-light me-2 rounded-3 active">Hard</button>

        </div>
        <!-- mode -->
        <div class="d-lg-flex ms-2 align-items-center d-none">
          <p class="me-2">Mode:</p>
          <button type="button" name="timeBtn" id="timeBtn"
            class="btn border text-light me-2 rounded-3 active">Timed(60)</button>
          <button type="button" name="passageBtn" id="passageBtn"
            class="btn border text-light  rounded-3">Passage</button>
        </div>

        <!-- phone screen -->
        <!-- difficulty -->
        <div class="dropdown d-lg-none flex-grow-1  ">
          <button id="btnTitle" class="btn border text-light   dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            Hard
          </button>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li class="d-flex align-items-center border-bottom pb-2  "><input class="dropdown-item" type="radio"
                name="difficulty" onclick="easy.click(); btnTitle.textContent ='Easy' " id="mobile-easy"><label
                for="mobile-easy" class="flex-grow-1">Easy</label></li>
            <li class="d-flex align-items-center border-bottom py-2  "><input class="dropdown-item" type="radio"
                name="difficulty" onclick="medium.click(); btnTitle.textContent ='Medium' " id="mobile-medium"><label
                for="mobile-medium" class="flex-grow-1">Medium</label></li>
            <li class="d-flex align-items-center  py-2  "><input type="radio" class="dropdown-item" name="difficulty"
                onclick="hard.click(); btnTitle.textContent ='Hard' " id="mobile-hard" checked><label for="mobile-hard"
                class="flex-grow-1">Hard</label></li>


          </ul>
        </div>
        <!-- mode -->
        <div class="dropdown d-lg-none flex-grow-1 ">
          <button id="md" class="btn border  text-light dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            Timed(60)
          </button>
          <ul class="dropdown-menu dropdown-menu-dark disabled">
            <li class="d-flex align-items-center border-bottom pb-2  "><input class="dropdown-item disabled"
                type="radio" name="mode" onclick="timeBtn.click(); md.textContent ='Timed(60)' " id="mobile-time"
                checked><label for="mobile-time" class="flex-grow-1">timed(60)</label></li>
            <li class="d-flex align-items-center  py-2    "><input type="radio" class="dropdown-item" name="mode"
                onclick="passageBtn.click(); md.textContent ='Passage' " id="mobile-passage"><label for="mobile-passage"
                class="flex-grow-1">passage</label></li>
          </ul>
        </div>

      </div>
    </div>
  </header>

  <main class="position-relative">
    <!-- loading -->
    <div id="loading" class="spinner-border position-absolute top-50 end-50  " role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <!-- words -->
    <div class="container">
      <div id="words" class="mb-3 "></div>
      <!-- restart button -->
      <div id="restart-div" class="d-none justify-content-center border-top border-2  pt-3 z-3 mb-4">
        <button id="restart-btn" type="button" class="btn bg-natural-800 fw-semibold  text-light mt-5 z-3 ">Restart Test
          </span><i class="fa-solid fa-sm fa-rotate-left ms-2"></i></button>
      </div>
      <!-- start button -->
      <div id="start-div" class="position-absolute start-50 top-50 translate-middle text-center d-none z-3">
        <button id="start" type="button" class="btn text-light bg-blue-600  mb-3">Start Typing Text</button>
        <p id="start-title" class="text-light">Or click the text and start typing</p>
      </div>
        <textarea name="" id="mobile-input" class="container" autocomplete="off"  autocapitalize="off" ></textarea>
    </div>
    <!-- result page -->
    <div id="result" class=" d-none flex-column align-items-center mt-5 ">

      <div id="img-div" class="rounded-circle green-shadow-700 mb-3">
        <img src="" id="result-img" class=" w-100 green-shadow-600 rounded-circle" alt="">
      </div>
      <div class="container">
        <img id="img-1" src="./assets/images/pattern-star-2.svg" alt="">
      </div>
      <h1 id="result-title" class="mb-3 text-center"></h1>
      <p id="result-text" class="mb-5 text-center"></p>
      <div class="container d-flex flex-column flex-lg-row justify-content-lg-center gap-4 result-details w100">
        <div class="border rounded-3  p-3">
          <p>WPM:</p>
          <p class="WPM text-light"> 0</p>
        </div>
        <div class="border rounded-3  p-3 ">
          <p>Accuracy:</p>
          <p class="Accuracy correct"> 0</p>
        </div>
        <div class="border rounded-3  p-3 ">
          <p>Characters:</p>
          <div class="" id="Characters"><span id="correctChar" class="correct"></span> <span
              style="font-size: x-large;">/</span> <span id="incorrectChar" class="color-red"></span></div>
        </div>
      </div>
      <div class="container text-end ">
        <img id="img-2" src="./assets/images/pattern-star-1.svg" alt="">
      </div>
      <button type="button" id="restart" class="btn btn-light mb-4"><span class="me-2">Go Again</span><i
          class="fa-solid fa-sm fa-rotate-left"></i>
      </button>

    </div>
  </main>

  </footer> -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./dist/index.js"></script>
</body>

</html>
